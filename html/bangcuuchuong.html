<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bảng cửu chương</title>
</head>
<body>
    <script>
    let n = Number(prompt("Nhập số cần in bảng cửu chương"));
    document.write("<h2>Bảng cửu chương " + n + "</h2>");
    for(let i=1;i<=10;i++){
    document.write(n + " x " + i + " = " + (n*i) + "<br>");
}
    </script>
</body>
</html>
