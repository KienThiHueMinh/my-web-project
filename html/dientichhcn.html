<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Diện tích hình chữ nhật</title>
</head>
<body>
    <script>
    let dai = Number(prompt("Nhập chiều dài:"));
    let rong = Number(prompt("Nhập chiều rộng:"));
    let dientich = dai * rong;
    document.write("Chiều dài: " + dai + "<br>");
    document.write("Chiều rộng: " + rong + "<br>");
    document.write("Diện tích hình chữ nhật là: " + dientich);
    </script>
</body>
</html>
